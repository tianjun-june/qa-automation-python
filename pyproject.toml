[project]
name = "qa-automation-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "pytest-playwright>=0.9.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
addopts = [
    "--screenshot=only-on-failure",
    "--tracing=retain-on-failure",
    "--output=test-results",
]

markers = [
    "smoke: criticl tests for basic system health",
    "regression: broader regression test suite",
]

log_cli = true
log_cli_level = "INFO"

log_format = "%(asctime)s | %(levelname)s | %(name)s | %(message)s"
log_date_format = "%Y-%m-%d %H-%M:%S"