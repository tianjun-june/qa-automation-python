name: UI Tests

on:
  push:
    branches:
      - main

jobs:
  ui-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Check uv
        run: uv --version

      - name: Install Python
        run: uv python install

      - name: Find Python
        run: uv python find

