name: UI Smoke Tests

on:
  push:
    branches:
      - main

  workflow_dispatch:


jobs:
  api-smkoe:
    runs-on: ubuntu 26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.20"
          enable-cache: true

      - name: Install denpendencies
        run: uv sync --locked --dev

      - name: Run api smkoe stests
        run:  |
          mkdir -p test-results
          uv run pytest tests/api -m smoke --env=qa \
            --junitxml=test-results/api-junit.xml \
            --html=test-results/api-report.html \
            --self-contained-html

      - name: Upload api artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: api_smoke-artifacts
          path: |
            test-results/
            logs
          if-no-files-found: ignore
          retention-days: 7

  ui-smoke:
    needs: api-smoke

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.20"
          enable-cache: true

      - name: Find Python
        run: uv python find

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Check pytest
        run: uv run pytest --version

      - name: Install Playwright browser
        run: uv run playwright install --with-deps chromium

      - name: Run smoke tests
        env:
          TEST_USERNAME: ${{secrets.TEST_USERNAME}}
          TEST_PASSWORD: ${{secrets.TEST_PASSWORD}}
        run: |
          mkdir -p test-results
          uv run pytest tests/ui -m smoke -v --env=qa \
          --junitxml=test-results/junit.xml \
          --html=test-results/report.html \
          --self-contained-html

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ui-test-artifacts
          path: |
            test-results/
            logs/
          if-no-files-found: ignore
          retention-days: 7