name: Self-hosted UI Tests

on:
  workflow_dispatch:

jobs:
  ui-tests:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Clean previous test artifacts
        run:  rm -rf test-results logs

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.20"

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium

      - name: Run smoke tests
        env:
          TEST_USERNAME: ${{secret.TEST_USERNAME}}
          TEST_PASSWORD: ${{secret.TEST_USERNAME}}
        run: |
          mkdir -p test-results
          uv run pytest tests/ui -m smoke -v --env=qa \
          --junitxml=test-results/junit.xml

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: self-hosted-ui-test-artifacts
          path: |
            test-results/
            logs/
          if-no-files=found: ignore
          retention-days: 7